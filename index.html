<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Thosabhorn</title>
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #3b6ef6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --fg: #f0f0f0;
      --muted: #a0a0a0;
      --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    text-align: center;
    padding: 2rem;
    max-width: 480px;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  p.tagline {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 2rem;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  nav a {
    color: var(--fg);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--muted);
    border-radius: 999px;
    transition: border-color 0.15s, color 0.15s;
  }
  nav a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Paul Thosabhorn</h1>
  <p class="tagline">Software Engineer</p>
  <nav>
    <a href="https://github.com/thosabhorn-bot" target="_blank" rel="noopener">GitHub</a>
    <a href="mailto:thosabhorn@gmail.com">Email</a>
  </nav>
</main>
</body>
</html>
